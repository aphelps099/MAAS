<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="flowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D8B4E;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3CAF5C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2D8B4E;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="flowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E7F9C;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#2CA3C4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1E7F9C;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D8B4E;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3CAF5C;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2D8B4E;stop-opacity:0"/>
    </linearGradient>

    <!-- Animated dash pattern -->
    <pattern id="flowDash" patternUnits="userSpaceOnUse" width="20" height="4">
      <rect width="12" height="4" fill="#3CAF5C" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Main energy flow paths -->

  <!-- Primary flow - waste to energy transformation -->
  <path d="M50 150 C150 150 150 80 250 80 C350 80 350 150 450 150 C500 150 530 120 550 100"
        stroke="url(#flowGreen)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Secondary flow -->
  <path d="M50 180 C150 180 180 220 280 220 C380 220 380 150 480 150 C520 150 540 130 560 120"
        stroke="url(#flowBlue)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Tertiary flow -->
  <path d="M50 120 C120 120 150 60 220 60 C290 60 320 100 380 100 C440 100 480 80 540 80"
        stroke="url(#flowGreen)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Glow effects -->
  <path d="M50 150 C150 150 150 80 250 80 C350 80 350 150 450 150 C500 150 530 120 550 100"
        stroke="url(#glowGreen)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Energy nodes/points -->
  <!-- Source node (waste/biogas) -->
  <g transform="translate(50, 150)">
    <circle r="20" fill="#1A1F1C" stroke="#2D8B4E" stroke-width="2"/>
    <circle r="8" fill="#2D8B4E" opacity="0.8"/>
    <circle r="4" fill="#3CAF5C"/>
  </g>

  <!-- Processing node -->
  <g transform="translate(250, 80)">
    <circle r="16" fill="#1A1F1C" stroke="#2D8B4E" stroke-width="2"/>
    <circle r="6" fill="#2D8B4E" opacity="0.8"/>
    <!-- Gear/processing icon -->
    <path d="M0 -10 L2 -4 L8 -4 L3 0 L5 6 L0 3 L-5 6 L-3 0 L-8 -4 L-2 -4 Z" fill="#3CAF5C" transform="scale(0.6)"/>
  </g>

  <!-- Output node (clean energy) -->
  <g transform="translate(550, 100)">
    <circle r="24" fill="#1A1F1C" stroke="#3CAF5C" stroke-width="3"/>
    <circle r="12" fill="#2D8B4E" opacity="0.6"/>
    <!-- Lightning bolt icon -->
    <path d="M2 -8 L-4 2 H2 L0 10 L6 -2 H0 Z" fill="#3CAF5C"/>
  </g>

  <!-- Particle effects along paths -->
  <g fill="#3CAF5C">
    <circle cx="100" cy="150" r="3" opacity="0.8"/>
    <circle cx="180" cy="110" r="2" opacity="0.6"/>
    <circle cx="300" cy="85" r="2.5" opacity="0.7"/>
    <circle cx="400" cy="120" r="2" opacity="0.5"/>
    <circle cx="500" cy="130" r="3" opacity="0.8"/>
  </g>

  <g fill="#2CA3C4">
    <circle cx="120" cy="180" r="2" opacity="0.6"/>
    <circle cx="220" cy="210" r="2.5" opacity="0.7"/>
    <circle cx="350" cy="200" r="2" opacity="0.5"/>
    <circle cx="430" cy="160" r="2" opacity="0.6"/>
  </g>

  <!-- Labels -->
  <text x="50" y="190" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#4A5D52" text-anchor="middle">WASTE</text>
  <text x="250" y="115" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#4A5D52" text-anchor="middle">PROCESS</text>
  <text x="550" y="145" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#3CAF5C" text-anchor="middle">ENERGY</text>

  <!-- Decorative arcs -->
  <path d="M30 250 Q150 280 300 250 Q450 220 570 250" stroke="#2D8B4E" stroke-width="1" stroke-opacity="0.2" fill="none"/>
  <path d="M30 270 Q150 300 300 270 Q450 240 570 270" stroke="#1E7F9C" stroke-width="1" stroke-opacity="0.15" fill="none"/>
</svg>